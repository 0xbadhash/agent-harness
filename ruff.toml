# agent-harness SoT — compliance_engine runs `ruff check` without per-product config.
# Classic correctness plus the constructs agents misuse: blind except, mutable
# defaults, shell=True, and runaway complexity. The ratchet freezes the legacy
# counts; new occurrences fail.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "BLE", "S602", "C90"]
ignore = [
  "E501",  # long lines common in CLI/docs strings
  "E402",  # import after sys.path bootstrap (tests + scripts)
]

[lint.per-file-ignores]
"tests/*" = ["E402"]

[lint.mccabe]
max-complexity = 20
