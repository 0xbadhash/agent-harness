name: daytime-gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  harness-daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dev deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff mypy hypothesis || true
      - name: J1 unit
        run: python -m pytest tests/ -q
      - name: J5 daytime readiness
        run: python scripts/daytime_readiness_subset.py --root .
      - name: J3 hardcodes
        run: python scripts/check_hardcodes.py
      - name: J7 secrets
        run: python scripts/check_secrets_diff.py --base HEAD~1 --head HEAD || true
      - name: J12 Semgrep
        run: |
          pip install -q semgrep
          semgrep --config .semgrep.yml --error --quiet .
  skill-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checklist when skill paths change
        run: |
          python scripts/agent_eval_checklist.py --root . --skip-tests || true
