# A3 — Daytime readiness + skill conformance (HSQ-2 real path filter).
name: daytime-gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  harness-daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dev deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff mypy || true
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Daytime readiness (this repo)
        run: python scripts/daytime_readiness_subset.py --root .
      - name: Hard gates dry structure
        run: python scripts/hard_gates.py --help

  skill-conformance:
    name: Skill conformance (agent_eval_checklist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect skill-relevant paths
        id: paths
        run: |
          set -euo pipefail
          RUN=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
            if echo "$CHANGED" | grep -E '^(skills/|scripts/.*gate|scripts/agent_eval|scripts/pipeline_state|scripts/hard_gates|AGENTS|docs/ship-flow|docs/web-e2e|config/ship_skills)' >/dev/null; then
              RUN=true
            fi
          fi
          echo "run_checklist=$RUN" >> "$GITHUB_OUTPUT"
          echo "skill_conformance_run=$RUN"
      - name: C5 agent eval checklist (skill conformance)
        if: steps.paths.outputs.run_checklist == 'true'
        run: python scripts/agent_eval_checklist.py --root . --skip-tests
      - name: Skip note
        if: steps.paths.outputs.run_checklist != 'true'
        run: echo "No skill-relevant paths changed — skill conformance skipped (HSQ-2)."
