name: daytime-gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  harness-daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dev deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov ruff mypy hypothesis pyyaml || true
      - name: J1 unit (coverage)
        env:
          # Keep coverage scratch out of the repo root: check_repo_hygiene
          # fails the pack on .coverage, and .agents/ is skipped.
          COVERAGE_FILE: .agents/artifacts/.coverage
        run: |
          mkdir -p .agents/artifacts
          python -m pytest tests/ -q \
            --ignore=tests/enhancement_specs \
            --cov=scripts \
            --cov-report=json:.agents/artifacts/coverage.json \
            --cov-report=term-missing:skip-covered
      - name: Coverage thresholds
        run: python scripts/check_module_coverage.py --from-json .agents/artifacts/coverage.json
      - name: Lint ratchet
        run: python scripts/check_lint_ratchet.py
      - name: J5 daytime readiness
        run: python scripts/daytime_readiness_subset.py --root .
      - name: J3 hardcodes
        run: python scripts/check_hardcodes.py
      - name: J7 secrets
        run: python scripts/check_secrets_diff.py --base HEAD~1 --head HEAD
      - name: J12 Semgrep
        run: |
          pip install -q semgrep
          semgrep --config .semgrep.yml --error . 2>&1 | tail -60
      - name: Import boundary
        run: python scripts/check_import_boundaries.py
      - name: Comment audit (diff)
        run: |
          BASE=origin/main
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE=HEAD~1
          python scripts/check_comment_audit.py --diff "$BASE...HEAD" --strict
      - name: Ticket DAG
        run: |
          for d in .agents/specs/*/tickets; do
            if [ -d "$d" ]; then python scripts/check_ticket_dag.py "$d"; fi
          done
  skill-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checklist when skill paths change
        run: |
          python scripts/agent_eval_checklist.py --root . --skip-tests
      - name: Agent-config evals (stale refs / edit guard)
        run: python scripts/run_agent_config_evals.py --root .
      - name: Skill drift
        run: python scripts/check_skill_drift.py
